<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POPMYC POS — Starting…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a5c4a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
      -webkit-app-region: drag;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 52px;
      height: 52px;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.30);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    .logo-text h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .logo-text p {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      margin-top: 2px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #4ECCA3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status {
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.3px;
    }

    .version {
      position: absolute;
      bottom: 16px;
      font-size: 11px;
      color: rgba(255,255,255,0.35);
    }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-icon">🛒</div>
    <div class="logo-text">
      <h1>POPMYC POS</h1>
      <p>Smart Retail. Better Business.</p>
    </div>
  </div>
  <div class="spinner"></div>
  <p class="status" id="status">Starting local services…</p>
  <p class="version" id="version">v…</p>

  <script>
    // Cycle through status messages to reassure the user startup is progressing
    const messages = [
      'Starting local services…',
      'Initialising database connection…',
      'Loading business data…',
      'Almost ready…',
    ];
    let i = 0;
    const el = document.getElementById('status');
    setInterval(() => {
      i = (i + 1) % messages.length;
      el.textContent = messages[i];
    }, 2500);

    // Read app version from URL query param injected by main.js (?v=1.0.5)
    try {
      const params = new URLSearchParams(window.location.search);
      const v = params.get('v');
      const vEl = document.getElementById('version');
      if (vEl && v) vEl.textContent = 'v' + v;
    } catch (e) { /* silently ignore */ }
  </script>
</body>
</html>
