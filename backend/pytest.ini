[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
# Only collect tests from the project source, not from .venv or venv
testpaths = 
    accounting/tests
    accounts/tests
    audit/tests
    audit_stage4/tests
    backups/tests
    branches/tests
    businesses/tests
    cloud/tests
    customers/tests
    employees/tests
    expenses/tests
    inventory/tests
    licensing/tests
    notifications/tests
    pharmacy/tests
    phones/tests
    products/tests
    purchases/tests
    repairs/tests
    reports/tests
    sales/tests
    setup
    suppliers/tests
    synchronization/tests
    tests
markers =
    unit: Fast unit tests that do not require the database
    integration: Tests that use the real database
