services:
  # ── PWA Static Frontend ────────────────────────────────────────────────────
  # Free Render static site — auto-deploys on every push to main.
  # Once you buy a domain, add it in the Render dashboard under
  # "Custom Domains" and update CORS_ALLOWED_ORIGINS on the backend service.
  - type: web
    name: popmyc-poos-app
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build:pwa
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    routes:
      # SPA fallback — all paths serve index.html so React Router handles routing
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Service worker must be served with no-cache so updates are picked up
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /workbox-*.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      # Web manifest
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
